<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MindWell - Focus Hunt</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            background: #f7f8fc;

            color: #222;

        }


        /* ================= HEADER ================= */

        header {

            height: 70px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 40px;

            box-shadow:
                0 2px 12px rgba(0,0,0,0.05);

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

            color: #5f5bd8;

        }


        .timer {

            font-weight: bold;

            color: #555;

        }


        /* ================= MAIN ================= */

        .container {

            max-width: 900px;

            margin: 40px auto;

            padding: 0 20px;

        }


        .game-header {

            text-align: center;

            margin-bottom: 25px;

        }


        .game-header h1 {

            margin-bottom: 10px;

        }


        .instruction {

            font-size: 18px;

            color: #555;

        }


        #targetColorText {

            font-weight: bold;

            text-transform: uppercase;

        }


        /* ================= STATS ================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 25px;

        }


        .stat {

            background: white;

            padding: 15px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.05);

        }


        .stat-number {

            font-size: 25px;

            font-weight: bold;

            color: #5f5bd8;

            margin-top: 5px;

        }


        /* ================= GAME AREA ================= */

        .game-area {

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.06);

        }


        .objects {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 18px;

        }


        .object {

            height: 75px;

            border-radius: 50%;

            cursor: pointer;

            transition: 0.15s;

        }


        .object:hover {

            transform: scale(1.08);

        }


        /* COLORS */

        .blue {

            background: #4f7cff;

        }


        .red {

            background: #ff5c5c;

        }


        .green {

            background: #4caf70;

        }


        .yellow {

            background: #f5c542;

        }


        .purple {

            background: #9b6cff;

        }


        /* ================= RESULT ================= */

        .result {

            display: none;

            text-align: center;

            background: white;

            padding: 35px;

            margin-top: 25px;

            border-radius: 18px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.06);

        }


        .result h2 {

            margin-bottom: 15px;

        }


        .result-score {

            font-size: 42px;

            font-weight: bold;

            color: #5f5bd8;

            margin: 15px 0;

        }


        .result button {

            border: none;

            padding: 12px 25px;

            border-radius: 10px;

            background: #5f5bd8;

            color: white;

            cursor: pointer;

            font-weight: bold;

            margin: 5px;

        }


        .result button:hover {

            opacity: 0.9;

        }


        @media (max-width: 700px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .objects {

                grid-template-columns:
                    repeat(4, 1fr);

            }


            .object {

                height: 60px;

            }


            header {

                padding: 0 20px;

            }

        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            🧠Wellora

        </div>


        <div class="timer">

            ⏱️ Time:

            <span id="timer">

                0

            </span>s

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <div class="container">


        <div class="game-header">

            <h1>

                🎯 Focus Hunt

            </h1>


            <p class="instruction">

                Find and click all the

                <span id="targetColorText">

                    target

                </span>

                circles.

            </p>

        </div>


        <!-- ================= STATS ================= -->

        <div class="stats">


            <div class="stat">

                <div>

                    Targets

                </div>


                <div
                    class="stat-number"
                    id="targetCount">

                    0

                </div>

            </div>


            <div class="stat">

                <div>

                    Correct

                </div>


                <div
                    class="stat-number"
                    id="correctCount">

                    0

                </div>

            </div>


            <div class="stat">

                <div>

                    Mistakes

                </div>


                <div
                    class="stat-number"
                    id="wrongCount">

                    0

                </div>

            </div>


            <div class="stat">

                <div>

                    Accuracy

                </div>


                <div
                    class="stat-number"
                    id="accuracy">

                    0%

                </div>

            </div>

        </div>


        <!-- ================= GAME ================= -->

        <div class="game-area">

            <div
                class="objects"
                id="objects">

            </div>

        </div>


        <!-- ================= RESULT ================= -->

        <div
            class="result"
            id="result">


            <h2>

                🎉 Activity Complete!

            </h2>


            <p>

                You completed the Focus Hunt.

            </p>


            <div
                class="result-score"
                id="finalScore">

                0

            </div>


            <p id="resultDetails">

            </p>


            <br>


            <button onclick="playAgain()">

                Play Again

            </button>


            <button onclick="goBack()">

                Back to Activities

            </button>


        </div>


    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ============================================
           SAVE GAME RESULT TO FASTAPI DATABASE
        ============================================ */

        async function saveGameResult(data) {

            const user = JSON.parse(
                localStorage.getItem("mindwell_user")
            );


            /* 
            Check whether employee is logged in
            */

            if (!user) {

                console.error(
                    "User not logged in"
                );

                return;

            }


            try {

                const response = await fetch(
                    "/game-result",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            employee_id:
                                user.employee_id,

                            game_name:
                                data.game_name,

                            time_taken:
                                data.time_taken ?? null,

                            correct:
                                data.correct ?? null,

                            wrong:
                                data.wrong ?? null,

                            accuracy:
                                data.accuracy ?? null,

                            score:
                                data.score ?? null,

                            metrics:
                                data.metrics ?? {}

                        })

                    }
                );


                const result =
                    await response.json();


                if (!response.ok) {

                    console.error(
                        "Failed to save game result:",
                        result
                    );

                    return;

                }


                console.log(
                    "Game result saved:",
                    result
                );


            } catch (error) {

                console.error(
                    "Error saving game result:",
                    error
                );

            }

        }


        /* ============================================
           GAME SETTINGS
        ============================================ */


        const colors = [

            "blue",
            "red",
            "green",
            "yellow",
            "purple"

        ];


        let targetColor;


        let totalTargets = 0;

        let correct = 0;

        let wrong = 0;

        let time = 0;

        let timerInterval;


        /* ============================================
           GET SELECTED GAME
        ============================================ */


        const selectedGame =
            localStorage.getItem(
                "selectedGame"
            );


        /*
        For now only Focus Hunt is implemented.

        Other games will be added one by one.
        */


        if (
            selectedGame &&
            selectedGame !== "focus"
        ) {

            alert(
                "This activity is coming next. For now, let's play Focus Hunt 🎯"
            );

        }


        /* ============================================
           START GAME
        ============================================ */


        function startGame() {


            /*
            Random target color
            */

            targetColor =
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ];


            /*
            Reset values
            */

            correct = 0;

            wrong = 0;

            time = 0;


            /*
            Reset timer display
            */

            document.getElementById(
                "timer"
            ).innerText = "0";


            /*
            Update instruction
            */

            const targetText =
                document.getElementById(
                    "targetColorText"
                );


            targetText.innerText =
                targetColor;


            targetText.style.color =
                targetColor === "yellow"
                    ? "#d39e00"
                    : targetColor;


            /*
            Generate objects
            */

            createObjects();


            /*
            Start timer
            */

            clearInterval(
                timerInterval
            );


            timerInterval =
                setInterval(
                    function () {

                        time++;


                        document.getElementById(
                            "timer"
                        ).innerText = time;


                    },
                    1000
                );


            updateStats();

        }


        /* ============================================
           CREATE OBJECTS
        ============================================ */


        function createObjects() {


            const container =
                document.getElementById(
                    "objects"
                );


            container.innerHTML = "";


            /*
            Total objects
            */

            const totalObjects = 20;


            /*
            Random number of target circles
            */

            totalTargets =
                Math.floor(
                    Math.random() * 5
                ) + 5;


            let targetPlaced = 0;


            for (
                let i = 0;
                i < totalObjects;
                i++
            ) {


                const object =
                    document.createElement(
                        "div"
                    );


                object.classList.add(
                    "object"
                );


                let color;


                /*
                Make sure required number
                of target colors are created.
                */

                if (
                    targetPlaced <
                    totalTargets
                ) {

                    color = targetColor;

                    targetPlaced++;

                } else {


                    /*
                    Pick random non-target color
                    */

                    const otherColors =
                        colors.filter(
                            c =>
                                c !== targetColor
                        );


                    color =
                        otherColors[
                            Math.floor(
                                Math.random() *
                                otherColors.length
                            )
                        ];

                }


                object.classList.add(
                    color
                );


                object.dataset.color =
                    color;


                object.addEventListener(
                    "click",
                    function () {

                        handleClick(
                            object
                        );

                    }
                );


                container.appendChild(
                    object
                );

            }


            /*
            Shuffle positions
            */

            shuffleObjects();

        }


        /* ============================================
           HANDLE CLICK
        ============================================ */


        function handleClick(object) {


            /*
            Prevent clicking the same
            object multiple times.
            */

            if (
                object.dataset.clicked ===
                "true"
            ) {

                return;

            }


            object.dataset.clicked =
                "true";


            const clickedColor =
                object.dataset.color;


            /*
            Check whether clicked color
            is the target color.
            */

            if (
                clickedColor ===
                targetColor
            ) {


                correct++;


                /*
                Hide correct object
                */

                object.style.visibility =
                    "hidden";


                /*
                Check if all targets
                have been found.
                */

                if (
                    correct ===
                    totalTargets
                ) {

                    finishGame();

                }

            } else {


                wrong++;


                /*
                Small visual feedback
                */

                object.style.opacity =
                    "0.35";

            }


            updateStats();

        }


        /* ============================================
           SHUFFLE OBJECTS
        ============================================ */


        function shuffleObjects() {


            const container =
                document.getElementById(
                    "objects"
                );


            const objects =
                Array.from(
                    container.children
                );


            objects.sort(
                () =>
                    Math.random() - 0.5
            );


            objects.forEach(
                object =>
                    container.appendChild(
                        object
                    )
            );

        }


        /* ============================================
           UPDATE STATS
        ============================================ */


        function updateStats() {


            document.getElementById(
                "targetCount"
            ).innerText =
                totalTargets;


            document.getElementById(
                "correctCount"
            ).innerText =
                correct;


            document.getElementById(
                "wrongCount"
            ).innerText =
                wrong;


            const attempts =
                correct + wrong;


            let accuracyValue = 0;


            if (
                attempts > 0
            ) {

                accuracyValue =
                    Math.round(
                        (
                            correct /
                            attempts
                        ) * 100
                    );

            }


            document.getElementById(
                "accuracy"
            ).innerText =
                accuracyValue + "%";

        }


        /* ============================================
           FINISH GAME
        ============================================ */


        function finishGame() {


            clearInterval(
                timerInterval
            );


            const attempts =
                correct + wrong;


            let accuracyValue = 0;


            if (
                attempts > 0
            ) {

                accuracyValue =
                    Math.round(
                        (
                            correct /
                            attempts
                        ) * 100
                    );

            }


            /*
            Demo score

            This is NOT a mental health score.
            It is only an activity performance score.
            */

            let finalScore =
                Math.max(
                    0,
                    Math.round(
                        accuracyValue -
                        (time * 0.5) -
                        (wrong * 2)
                    )
                );


            /*
            Store activity data
            */

            const gameData = {

                game:
                    "Focus Hunt",

                targetColor:
                    targetColor,

                time:
                    time,

                correct:
                    correct,

                wrong:
                    wrong,

                accuracy:
                    accuracyValue,

                score:
                    finalScore,

                date:
                    new Date().toISOString()

            };


            /*
            =========================================
            SAVE BACKUP IN LOCAL STORAGE
            =========================================
            */

            localStorage.setItem(

                "mindwell_focus_hunt",

                JSON.stringify(
                    gameData
                )

            );


            /*
            =========================================
            SAVE RESULT TO FASTAPI DATABASE
            =========================================
            */

            saveGameResult({

                game_name:
                    "Focus Hunt",

                time_taken:
                    time,

                correct:
                    correct,

                wrong:
                    wrong,

                accuracy:
                    accuracyValue,

                score:
                    finalScore,

                metrics: {

                    targetColor:
                        targetColor,

                    totalTargets:
                        totalTargets,

                    attempts:
                        attempts

                }

            });


            /*
            Show result
            */

            document.getElementById(
                "finalScore"
            ).innerText =
                finalScore;


            document.getElementById(
                "resultDetails"
            ).innerText =

                "Time: " +
                time +
                "s · Accuracy: " +
                accuracyValue +
                "% · Target: " +
                targetColor;


            document.getElementById(
                "result"
            ).style.display =
                "block";


            document.querySelector(
                ".game-area"
            ).style.display =
                "none";

        }


        /* ============================================
           PLAY AGAIN
        ============================================ */


        function playAgain() {


            document.getElementById(
                "result"
            ).style.display =
                "none";


            document.querySelector(
                ".game-area"
            ).style.display =
                "block";


            startGame();

        }


        /* ============================================
           BACK
        ============================================ */


        function goBack() {


            window.location.href =
                "/employee";

        }


        /* ============================================
           START
        ============================================ */


        startGame();


    </script>


</body>

</html>
