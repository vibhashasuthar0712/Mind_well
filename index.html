<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindWell - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f5f3, #eef3ff);
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .tagline {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #6c63ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #ffe8e8;
            color: #d93025;
            font-size: 14px;
            text-align: center;
        }

        .success-message {
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #e8f8ef;
            color: #18864b;
            font-size: 14px;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>


<body>

    <div class="login-container">

        <div class="logo">
            🧠 MindWell
        </div>

        <p class="tagline">
            Your wellbeing. Your privacy. Your support.
        </p>


        <form id="loginForm">

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="input-group">

                <label for="role">
                    Login as
                </label>

                <select id="role" required>

                    <option value="">
                        Select role
                    </option>

                    <option value="employee">
                        Employee
                    </option>

                    <option value="responder">
                        Responder
                    </option>

                    <option value="hr">
                        HR / Admin
                    </option>

                </select>

            </div>


            <!-- Error message -->

            <div
                id="errorMessage"
                class="error-message">
            </div>


            <!-- Success message -->

            <div
                id="successMessage"
                class="success-message">
            </div>


            <button
                type="submit"
                id="loginButton">

                Login

            </button>

        </form>


        <div class="footer">

            🔒 Your personal wellbeing information stays private.

        </div>

    </div>



    <script>

        const loginForm = document.getElementById("loginForm");

        const loginButton = document.getElementById("loginButton");

        const errorMessage = document.getElementById("errorMessage");

        const successMessage = document.getElementById("successMessage");


        loginForm.addEventListener("submit", async function(event) {

            // Stop normal form submission
            event.preventDefault();


            // Get values from form
            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const role =
                document.getElementById("role").value;


            // Clear previous messages
            errorMessage.style.display = "none";
            successMessage.style.display = "none";


            // Disable button while login is processing
            loginButton.disabled = true;

            loginButton.innerText = "Logging in...";


            try {

                // Send login request to FastAPI
                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        email: email,

                        password: password,

                        role: role

                    })

                });


                // Convert response to JSON
                const data = await response.json();


                // Login failed
                if (!response.ok) {

                    errorMessage.innerText =
                        data.detail || "Login failed. Please try again.";

                    errorMessage.style.display = "block";

                    loginButton.disabled = false;

                    loginButton.innerText = "Login";

                    return;
                }


                // Login successful
                successMessage.innerText =
                    "Login successful! Redirecting...";

                successMessage.style.display = "block";


                // Store logged-in user information
                localStorage.setItem(
                    "mindwell_user",
                    JSON.stringify(data)
                );


                // Redirect according to role
                setTimeout(function() {

                    if (data.role === "employee") {

                        window.location.href = "employee.html";

                    }

                    else if (data.role === "responder") {

                        window.location.href = "responder.html";

                    }

                    else if (data.role === "hr") {

                        window.location.href = "hr.html";

                    }

                }, 500);


            }

            catch (error) {

                console.error("Login error:", error);


                errorMessage.innerText =
                    "Unable to connect to MindWell server.";

                errorMessage.style.display = "block";


                loginButton.disabled = false;

                loginButton.innerText = "Login";

            }

        });

    </script>

</body>

</html>
